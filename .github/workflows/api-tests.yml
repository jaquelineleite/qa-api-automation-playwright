name: API Quality Gate

on:
  push:
    branches: [main, master, develop]

  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Quality Check
        id: typecheck
        run: npm run typecheck

      - name: Execute Smoke Tests
        id: smoke
        run: npm run test:smoke

      - name: Execute API Regression
        id: regression
        run: npm run test:regression

      - name: Generate Quality Metrics
        if: ${{ always() && steps.regression.outcome != 'skipped' }}
        run: npm run quality:metrics

      - name: Publish Quality Summary
        if: ${{ always() && steps.regression.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ "${{ steps.regression.outcome }}" = "success" ]; then
            REGRESSION_STATUS="✅ Passed"
          else
            REGRESSION_STATUS="❌ Failed"
          fi

          {
            echo "## 🧪 API Quality Summary"
            echo ""
            echo "### Pipeline Status"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| TypeScript Quality Check | ${{ steps.typecheck.outcome }} |"
            echo "| Smoke Tests | ${{ steps.smoke.outcome }} |"
            echo "| API Regression | ${REGRESSION_STATUS} |"
            echo ""

            if [ -f reports/quality/quality-summary.md ]; then
              cat reports/quality/quality-summary.md
            else
              echo "> Quality metrics could not be generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: reports/playwright-report
          retention-days: 7

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results
          path: reports/junit/results.xml
          retention-days: 7

      - name: Upload Quality Metrics
        if: ${{ always() && steps.regression.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-metrics
          path: reports/quality
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  ownership-local:
    name: Local Cart Ownership Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000
    env:
      RUN_OWNERSHIP_TEST: 'true'
      API_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for isolated ServeRest
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/usuarios; then
              exit 0
            fi
            sleep 2
          done
          echo 'Local ServeRest did not become ready'
          exit 1
      - name: Execute cross-user ownership regression
        run: npx playwright test src/tests/users/cart-ownership-local.spec.ts --workers=1
      - name: Upload local ownership test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ownership-local-junit
          path: reports/junit/results.xml
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs: [api-tests, ownership-local]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate quality gate
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ] || [ "${{ needs.ownership-local.result }}" != "success" ]; then
            echo "QUALITY GATE: FAILED"
            echo "TypeScript, smoke, API regression, or local ownership regression failed."
            exit 1
          fi

          echo "QUALITY GATE: PASSED"
          echo "Smoke, API regression and isolated ownership regression completed successfully."