name: API Quality Gate

on:
  push:
    branches: [main, master, develop]

  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Quality Check
        run: npm run typecheck

      - name: Execute Smoke Tests
        run: npm run test:smoke

      - name: Execute API Regression
        id: regression
        run: npm run test:regression

      - name: Generate Quality Metrics
        if: ${{ always() && steps.regression.outcome != 'skipped' }}
        run: npm run quality:metrics

      - name: Publish Quality Summary
        if: ${{ always() && steps.regression.outcome != 'skipped' }}
        shell: bash
        run: |
          if [ "${{ steps.regression.outcome }}" = "success" ]; then
            REGRESSION_STATUS="✅ Passed"
          else
            REGRESSION_STATUS="❌ Failed"
          fi

          {
            echo "## 🧪 API Quality Summary"
            echo ""
            echo "### Pipeline Status"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| TypeScript Quality Check | ✅ Passed |"
            echo "| Smoke Tests | ✅ Passed |"
            echo "| API Regression | ${REGRESSION_STATUS} |"
            echo ""

            if [ -f reports/quality/quality-summary.md ]; then
              cat reports/quality/quality-summary.md
            else
              echo "> Quality metrics could not be generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: reports/playwright-report
          retention-days: 7

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results
          path: reports/junit/results.xml
          retention-days: 7

      - name: Upload Quality Metrics
        if: ${{ always() && steps.regression.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-metrics
          path: reports/quality
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate quality gate
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ]; then
            echo "QUALITY GATE: FAILED"
            echo "TypeScript validation, smoke tests, or mandatory API regression failed."
            exit 1
          fi

          echo "QUALITY GATE: PASSED"
          echo "Smoke and mandatory API regression completed successfully."