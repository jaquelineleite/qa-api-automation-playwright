name: API Quality Gate

on:
  push:
    branches: [main, master, develop]

  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Quality Check
        run: npm run typecheck

      - name: Execute API Regression
        run: npm test

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report
          retention-days: 7

      - name: Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: reports/junit/results.xml
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate quality gate
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ]; then
            echo "QUALITY GATE: FAILED"
            echo "TypeScript validation or mandatory API regression failed."
            exit 1
          fi

          echo "QUALITY GATE: PASSED"
          echo "Mandatory API validation completed successfully."